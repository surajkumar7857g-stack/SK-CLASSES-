<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000d1a">
    <title>SK CLASSES | Target Board Study Platform</title>
    
    <!-- Firebase SDKs (Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForSkClasses-Config54c05",
            authDomain: "sk-classes-54c05.firebaseapp.com",
            projectId: "sk-classes-54c05",
            storageBucket: "sk-classes-54c05.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 100% Working Popup Login
        window.handleGoogleLogin = function() {
            signInWithPopup(auth, provider).then((result) => {
                checkVipStatus(result.user);
            }).catch((error) => {
                alert("लॉगिन में दिक्कत आ रही है: " + error.message);
                console.error("Popup Login Error", error);
            });
        };

        // Skip/Guest Mode for instant access
        window.continueAsGuest = function() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('userEmailDisplay').innerText = "Guest Student";
            document.getElementById('vipBadge').innerHTML = "👤 Free User";
        };

        window.handleLogout = function() {
            signOut(auth).then(() => {
                location.reload();
            });
        };

        onAuthStateChanged(auth, async (user) => {
            const loginModal = document.getElementById('loginModal');
            if (user) {
                loginModal.style.display = 'none';
                document.getElementById('userEmailDisplay').innerText = user.email;
                await checkVipStatus(user);
            }
        });

        async function checkVipStatus(user) {
            try {
                const docRef = doc(db, "vipUsers", user.email);
                const docSnap = await getDoc(docRef);
                const vipBadge = document.getElementById('vipBadge');
                const adContainer = document.getElementById('adContainer');

                if (docSnap.exists() && docSnap.data().isVip === true) {
                    vipBadge.innerHTML = "⭐ VIP Member";
                    vipBadge.style.background = "#ffd700";
                    vipBadge.style.color = "#000";
                    if(adContainer) adContainer.style.display = 'none';
                } else {
                    vipBadge.innerHTML = "🔒 Free User";
                    if(adContainer) adContainer.style.display = 'block';
                }
            } catch(e) {
                console.log("VIP Check skipped");
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #000d1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #001f3f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; }
        .logo { font-size: 20px; font-weight: bold; color: #00ff88; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .logout-btn { background: #ff4d4d; border: none; padding: 5px 10px; color: white; border-radius: 4px; cursor: pointer; }
        
        .main-container { flex: 1; display: flex; flex-direction: column; width: 100%; height: calc(100vh - 60px); }
        iframe { flex: 1; width: 100%; border: none; background: #fff; }

        /* Login Modal Overlay */
        #loginModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: #001f3f; padding: 30px; border-radius: 12px; text-align: center; max-width: 350px; width: 90%;
            border: 2px solid #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .login-card h2 { margin-bottom: 10px; color: #00ff88; }
        .login-card p { font-size: 14px; margin-bottom: 20px; color: #ccc; }
        .google-btn {
            background: white; color: #333; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
            margin-bottom: 10px;
        }
        .skip-btn {
            background: transparent; color: #00ff88; border: 1px solid #00ff88; padding: 10px; width: 100%;
            border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;
        }

        /* VIP Floating Bar & Modal */
        .vip-bar { background: #111; padding: 10px; text-align: center; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .vip-btn { background: #ffd700; color: #000; border: none; padding: 6px 15px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        
        #vipModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10000; }
        .vip-modal-content { background: #111; padding: 25px; border-radius: 10px; text-align: center; max-width: 320px; width: 90%; border: 1px solid #ffd700; }
        .vip-modal-content img { width: 150px; height: 150px; margin: 15px 0; background: white; padding: 5px; border-radius: 8px; }
        .close-vip { background: #ff4d4d; color: white; border: none; padding: 5px 12px; margin-top: 15px; border-radius: 4px; cursor: pointer; }
        .pay-link-btn { display: inline-block; background: #00ff88; color: #000; padding: 10px 15px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="loginModal">
        <div class="login-card">
            <h2>SK CLASSES</h2>
            <p>पढ़ाई शुरू करने के लिए Google से लॉगिन करें या सीधे आगे बढ़ें।</p>
            
            <button class="google-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.26h2.9c1.7-1.57 2.69-3.88 2.69-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.34 0-4.32-1.58-5.03-3.7H1v2.33C2.56 15.98 5.52 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.75c-.18-.54-.28-1.12-.28-1.75s.1-1.21.28-1.75V4.92H1.04C.38 6.24 0 7.76 0 9.4s.38 3.16 1.04 4.48l2.93-2.31z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.52 0 2.56 2.02 1.04 4.92l2.93 2.33c.71-2.12 2.69-3.67 5.03-3.67z"/></svg>
                Google से लॉगिन करें
            </button>

            <button class="skip-btn" onclick="continueAsGuest()">सीधे पढ़ाई शुरू करें (Guest)</button>
        </div>
    </div>

    <!-- Top Navigation Header -->
    <header>
        <div class="logo">SK CLASSES</div>
        <div class="user-info">
            <span id="vipBadge" style="font-size: 12px; padding: 3px 8px; background: #333; border-radius: 4px;">Loading...</span>

    <div class="main-container">

            <script type="text/javascript">

        <iframe src="https://gb-study-targetboard.ai.studio/"></iframe>

            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=7857840922@ybl&pn=SK%20Classes&am=5.00&cu=INR" alt="UPI QR Code">
            
            <p style="font-size: 12px; color: #00ff88; word-break: break-all;">UPI ID: <b>7857840922@ybl</b></p>
            
            <a href="upi://pay?pa=7857840922@ybl&pn=SK%20Classes&am=5.00&cu=INR" class="pay-link-btn">Direct Pay via UPI App</a>
            
            <br>
            <button class="close-vip" onclick="document.getElementById('vipModal').style.display='none'">बंद करें</button>

</body>
</html>
